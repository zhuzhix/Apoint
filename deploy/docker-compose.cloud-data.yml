name: astock-data-cloud

services:
  redis:
    image: redis:8
    container_name: astock-cloud-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: >-
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 768mb
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD}
    ports:
      - "${DATA_BIND_IP}:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a '$${REDIS_PASSWORD}' ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  mysql:
    image: mysql:8.4
    container_name: astock-cloud-mysql
    restart: unless-stopped
    command:
      - --default-time-zone=+08:00
      - --innodb-buffer-pool-size=512M
      - --innodb-log-buffer-size=32M
      - --innodb-flush-log-at-trx-commit=2
      - --skip-log-bin
      - --max-connections=100
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: astock_monitor
      MYSQL_USER: astock_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
    ports:
      - "${DATA_BIND_IP}:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p'$${MYSQL_ROOT_PASSWORD}' --silent"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 30s

volumes:
  redis-data:
  mysql-data:

services:
  redis:
    image: redis:8
    container_name: astock-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    command: >-
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:

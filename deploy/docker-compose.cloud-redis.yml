name: astock-redis-cloud

services:
  redis:
    image: redis:8
    container_name: astock-cloud-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: >-
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 1gb
      --maxmemory-policy noeviction
      --requirepass ${REDIS_PASSWORD}
    ports:
      - "${DATA_BIND_IP}:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a '$${REDIS_PASSWORD}' ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 10s

volumes:
  redis-data:
